<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verso Notebook</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Verso.Blazor.Shared/app.css" />
</head>
<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#666;">
            Loading Verso...
        </div>
    </div>

    <script src="js/vscode-bridge.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/monaco-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/dashboard-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/custom-layout-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/verso-layout-assets.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/verso-layout-frame.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/panel-resize-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/file-download-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/mermaid-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/cell-interact-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/panel-interact-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/layout-interact-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/verso-inline-layout-bridge.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/parameters-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/cell-drag-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/user-prefs-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/tag-input-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/widget-interop.js"></script>
    <script src="_content/Verso.Blazor.Shared/js/tooltip.js"></script>
    <!--
        The language has to be settled before the runtime boots, because that is when
        WebAssembly fetches satellite assemblies and picks its globalization data. Passing it
        to Blazor.start is the supported way to do that; assigning a culture afterwards is
        rejected unless the app downloads the entire ICU dataset. The VS Code webview builds
        its own host page and sets window.versoLocale from the extension setting. Served
        directly, the browser's own language is the best guess available.
    -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            applicationCulture: window.versoLocale || navigator.language || undefined
        });
    </script>
</body>
</html>
