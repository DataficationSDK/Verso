name: Verso CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "templates/**"
      - "vscode/**"
      - "samples/showcase/**"
      - "build/i18n/**"
      - "Verso.sln"
      - ".github/workflows/verso-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "templates/**"
      - "vscode/**"
      - "samples/showcase/**"
      - "build/i18n/**"
      - "Verso.sln"
      - ".github/workflows/verso-ci.yml"
  workflow_dispatch:

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The Python kernel launches the user's own interpreter, so a large part of its suite needs
      # a real one on PATH and reports a missing prerequisite without it. Pinned rather than left
      # to whatever the runner image happens to carry, so every platform tests the same version,
      # and it is what makes the Windows process launcher covered at all: it is native code that
      # no developer machine here can run.
      - name: Setup Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Installed into that interpreter rather than provisioned at test time, so the completion,
      # hover, and diagnostics tests do not depend on reaching a package index while they run.
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip jedi

      # None of what this catches fails the build: a missing translation falls back to English,
      # and a translation that lost the `{0}` it was going to fill in only throws when the message
      # is finally shown to somebody. It reads the committed files and nothing else, so it needs no
      # API key and no network, and it runs before the build so a drifted string is reported in
      # seconds rather than after everything has compiled.
      - name: Check translations
        run: python build/i18n/check.py

      - name: Restore
        run: dotnet restore Verso.sln

      - name: Build
        run: dotnet build Verso.sln --configuration Release --no-restore

      - name: Test
        env:
          # Names the interpreter the two steps above prepared, instead of leaving the kernel to
          # discover one. First on PATH is not enough: these images carry several Pythons, and on
          # Windows the launcher is consulted ahead of any path scan, so the kernel can resolve a
          # different interpreter than the one holding the analysis library. The tests that need it
          # then have nothing to work with, and the same version has to be pinned in both places
          # for the tools directory, which is keyed by version, to be the one the kernel reads.
          VERSO_PYTHON: ${{ steps.python.outputs.python-path }}
        run: >-
          dotnet test Verso.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx

      - name: Install ReportGenerator
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: >-
          reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"TestResults/CoverageReport"
          -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/CoverageReport

      - name: Post coverage summary
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: TestResults/CoverageReport/SummaryGithub.md

  nuget-validate:
    name: NuGet Validation
    runs-on: ubuntu-latest
    needs: dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Bundle blazor.web.js for CLI
        run: |
          DIR="src/Verso.Cli/bin/Release/net8.0/wwwroot/_framework"
          mkdir -p "$DIR"
          DLL=$(find "$DOTNET_ROOT/shared/Microsoft.AspNetCore.App" \
                -path "*/8.*/Microsoft.AspNetCore.Components.Endpoints.dll" | head -1)
          if [ -z "$DLL" ]; then
            echo "::warning::Could not find .NET 8 Components.Endpoints.dll"
            exit 0
          fi
          dotnet new console -o /tmp/_ebjs --no-restore -f net8.0
          cat > /tmp/_ebjs/Program.cs << 'EOF'
          var asm = System.Reflection.Assembly.LoadFrom(args[0]);
          using var s = asm.GetManifestResourceStream("_framework/blazor.web.js");
          if (s == null) { Console.Error.WriteLine("Resource not found"); return; }
          Directory.CreateDirectory(Path.GetDirectoryName(args[1])!);
          using var f = File.Create(args[1]);
          s.CopyTo(f);
          Console.WriteLine($"Extracted blazor.web.js ({f.Length} bytes)");
          EOF
          dotnet run --project /tmp/_ebjs -- "$DLL" "$DIR/blazor.web.js"

      - name: Build
        run: dotnet build Verso.sln -c Release

      - name: Pack NuGet packages
        run: |
          dotnet pack src/Verso.Abstractions/Verso.Abstractions.csproj -c Release --no-build -o packages
          dotnet pack src/Verso/Verso.csproj -c Release --no-build -o packages
          dotnet pack src/Verso.Ado/Verso.Ado.csproj -c Release --no-build -o packages
          dotnet pack src/Verso.FSharp/Verso.FSharp.csproj -c Release --no-build -o packages
          dotnet pack src/Verso.Http/Verso.Http.csproj -c Release --no-build -o packages
          dotnet pack src/Verso.JavaScript/Verso.JavaScript.csproj -c Release --no-build -o packages
          dotnet pack src/Verso.PowerShell/Verso.PowerShell.csproj -c Release --no-build -o packages
          dotnet pack src/Verso.Python/Verso.Python.csproj -c Release --no-build -o packages
          dotnet pack src/Verso.Testing/Verso.Testing.csproj -c Release --no-build -o packages
          dotnet pack templates/Verso.Templates/Verso.Templates.csproj -c Release --no-build -o packages
          dotnet pack src/Verso.Cli/Verso.Cli.csproj -c Release --no-build -o packages
          # Showcase samples are not part of Verso.sln, so pack must build them here.
          # GeneratePackageOnBuild is overridden off: when it is on, dotnet pack sets
          # NoBuild and fails with NU5026 on a fresh runner (NuGet/Home#7801).
          dotnet pack samples/showcase/image-studio/src/Verso.Showcase.ImageStudio/Verso.Showcase.ImageStudio.csproj -c Release -p:GeneratePackageOnBuild=false -o packages
          dotnet pack samples/showcase/form-studio/src/Verso.Showcase.FormStudio/Verso.Showcase.FormStudio.csproj -c Release -p:GeneratePackageOnBuild=false -o packages
          dotnet pack samples/showcase/grid-studio/src/Verso.Showcase.GridStudio/Verso.Showcase.GridStudio.csproj -c Release -p:GeneratePackageOnBuild=false -o packages
          dotnet pack samples/showcase/slide-studio/src/Verso.Showcase.SlideStudio/Verso.Showcase.SlideStudio.csproj -c Release -p:GeneratePackageOnBuild=false -o packages

      - name: Validate packages
        run: |
          for pkg in packages/*.nupkg; do
            echo "Validating $pkg..."
            dotnet nuget verify "$pkg" --all 2>/dev/null || echo "  (signature verification skipped — package is unsigned)"
            # Verify the package is a valid zip/nupkg
            unzip -t "$pkg" > /dev/null
            echo "  OK"
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packages/*.nupkg

  python-host:
    name: Python Host (${{ matrix.python-version }})
    # Pinned to 22.04: the 24.04 image does not serve Python 3.8, which is the oldest
    # interpreter the host script supports and therefore has to keep being tested against.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # jedi is what the host uses for completions, hover, and diagnostics when it is available.
      # Installing it here exercises those paths; the tests that cover the standard-library
      # fallbacks force them regardless of whether it is present.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jedi

      - name: Run host script tests
        run: python -m pytest tests/versohost -q

      # The widget tests that need a real ipywidgets skip themselves without one, and it cannot
      # be installed alongside the suite: importing ipywidgets requires IPython, and the tests
      # covering the stand-in for IPython.display assert what happens when no real one exists.
      # An environment of its own keeps both covered. One interpreter is enough, because what is
      # being checked is what the widget library writes, which does not vary by Python version.
      - name: Run widget tests against a real ipywidgets
        if: matrix.python-version == '3.13'
        run: |
          python -m venv .widget-env
          .widget-env/bin/python -m pip install --quiet --upgrade pip pytest ipywidgets
          .widget-env/bin/python -m pytest tests/versohost/test_display.py tests/versohost/test_comm.py -q

  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: vscode

      - name: Lint
        run: npm run lint
        working-directory: vscode

      - name: Build extension
        run: npm run build
        working-directory: vscode

      - name: Compile tests
        run: npx tsc -p tsconfig.test.json
        working-directory: vscode

      - name: Run extension tests
        run: xvfb-run -a npm test
        working-directory: vscode

      - name: Package VSIX
        run: npx vsce package --skip-license --no-dependencies
        working-directory: vscode

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: verso-vsix
          path: vscode/*.vsix
