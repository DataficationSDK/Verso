name: Verso Release

on:
  push:
    tags:
      - "verso-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.0)"
        required: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/verso-v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The Python kernel launches a real interpreter, and a large part of its suite treats a
      # missing one as a failure on a build server rather than a skip. Pinned here for the same
      # reason as in the CI workflow, so a release cannot be blocked by whatever Python the runner
      # image happens to carry, nor by reaching a package index while the tests run.
      - name: Setup Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip jedi

      - name: Build
        run: dotnet build Verso.sln -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        env:
          VERSO_PYTHON: ${{ steps.python.outputs.python-path }}
        run: dotnet test Verso.sln -c Release --no-build

      - name: Pack NuGet packages
        run: |
          dotnet pack src/Verso.Abstractions/Verso.Abstractions.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          dotnet pack src/Verso/Verso.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          dotnet pack src/Verso.Ado/Verso.Ado.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          dotnet pack src/Verso.DataFrame/Verso.DataFrame.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          dotnet pack src/Verso.FSharp/Verso.FSharp.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          dotnet pack src/Verso.Http/Verso.Http.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          dotnet pack src/Verso.JavaScript/Verso.JavaScript.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          dotnet pack src/Verso.PowerShell/Verso.PowerShell.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          dotnet pack src/Verso.Python/Verso.Python.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          dotnet pack src/Verso.Testing/Verso.Testing.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          dotnet pack templates/Verso.Templates/Verso.Templates.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          dotnet pack src/Verso.Cli/Verso.Cli.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
          # Showcase samples are not part of Verso.sln, so pack must build them here.
          # GeneratePackageOnBuild is overridden off: when it is on, dotnet pack sets
          # NoBuild and fails with NU5026 on a fresh runner (NuGet/Home#7801).
          dotnet pack samples/showcase/image-studio/src/Verso.Showcase.ImageStudio/Verso.Showcase.ImageStudio.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -p:GeneratePackageOnBuild=false -o packages
          dotnet pack samples/showcase/form-studio/src/Verso.Showcase.FormStudio/Verso.Showcase.FormStudio.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -p:GeneratePackageOnBuild=false -o packages
          dotnet pack samples/showcase/grid-studio/src/Verso.Showcase.GridStudio/Verso.Showcase.GridStudio.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -p:GeneratePackageOnBuild=false -o packages
          dotnet pack samples/showcase/slide-studio/src/Verso.Showcase.SlideStudio/Verso.Showcase.SlideStudio.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -p:GeneratePackageOnBuild=false -o packages
          dotnet pack samples/showcase/dag-notebook/src/Verso.Showcase.DagNotebook/Verso.Showcase.DagNotebook.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -p:GeneratePackageOnBuild=false -o packages

      - name: Check the CLI tool carries blazor.web.js
        run: unzip -l packages/Verso.Cli.*.nupkg | grep -q "tools/net10.0/any/wwwroot/_framework/blazor.web.js"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packages/*.nupkg

  build-vsix:
    name: Build VSIX
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set version
        run: npm version ${{ needs.build-and-test.outputs.version }} --no-git-tag-version
        working-directory: vscode

      - name: Install dependencies
        run: npm ci
        working-directory: vscode

      # The host and wasm publishes must carry the release version: the extension
      # host rejects extension packages that reference a newer Verso.Abstractions
      # assembly version than its own, so an unstamped host (1.0.0) cannot load
      # any extension published by this release.
      - name: Build all
        run: |
          npm run build:host -- -p:Version=${{ needs.build-and-test.outputs.version }}
          npm run build:wasm -- -p:Version=${{ needs.build-and-test.outputs.version }}
          npm run build
        working-directory: vscode

      - name: Package VSIX
        run: npx vsce package --skip-license
        working-directory: vscode

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: verso-vsix
          path: vscode/*.vsix

  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/verso-v')

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Push to NuGet.org
        run: |
          for pkg in packages/*.nupkg; do
            echo "Publishing $pkg..."
            dotnet nuget push "$pkg" \
              --api-key "${{ secrets.NUGET_VERSO_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  publish-vsix:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [build-and-test, build-vsix]
    if: startsWith(github.ref, 'refs/tags/verso-v')

    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: verso-vsix
          path: vsix

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath vsix/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test, build-vsix, publish-nuget, publish-vsix]
    if: startsWith(github.ref, 'refs/tags/verso-v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: verso-vsix
          path: vsix

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/*.nupkg
            vsix/*.vsix
